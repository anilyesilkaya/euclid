<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SVG Canvas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="toolbar" aria-label="Tools">
      <button class="tool" data-tool="select" title="Select (V)">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 3 L4 17 L8 13 L11 20 L13 19 L10 12 L16 12 Z" fill="currentColor"/></svg>
      </button>
      <button class="tool" data-tool="rect" title="Rectangle (R)">
        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="4" y="6" width="16" height="12" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button class="tool" data-tool="ellipse" title="Ellipse (E) — hold Shift for a circle">
        <svg viewBox="0 0 24 24" width="20" height="20"><ellipse cx="12" cy="12" rx="9" ry="6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button class="tool" data-tool="line" title="Line (L)">
        <svg viewBox="0 0 24 24" width="20" height="20"><line x1="4" y1="20" x2="20" y2="4" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button class="tool" data-tool="connector" title="Connector (X) — drag between shapes">
        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="2" y="4" width="6" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="16" y="15" width="6" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 6.5 H12 V17.5 H15.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 15l3 2.5-3 2.5z" fill="currentColor"/></svg>
      </button>
      <button class="tool" data-tool="polyline" title="Polyline (P)">
        <svg viewBox="0 0 24 24" width="20" height="20"><polyline points="4,18 9,8 14,14 20,4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button class="tool" data-tool="text" title="Text (T)">
        <svg viewBox="0 0 24 24" width="20" height="20"><text x="12" y="17" text-anchor="middle" font-family="serif" font-size="18" font-weight="700" fill="currentColor">T</text></svg>
      </button>
    </aside>

    <main id="canvas-wrap">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
        <defs>
          <!-- Document-space grid: minor cells tiled inside a major cell that also
               draws the bold line. Scales with the viewBox (zoom) automatically. -->
          <pattern id="grid-minor" width="10" height="10" patternUnits="userSpaceOnUse">
            <path class="grid-minor-line" d="M10 0H0V10" fill="none"/>
          </pattern>
          <pattern id="grid-major" width="50" height="50" patternUnits="userSpaceOnUse">
            <rect width="50" height="50" fill="url(#grid-minor)"/>
            <path class="grid-major-line" d="M50 0H0V50" fill="none"/>
          </pattern>
          <!-- Connector arrowheads. markerUnits=userSpaceOnUse keeps them a fixed
               world size (not scaled by stroke width); context-stroke tints them to
               match the connector's stroke. -->
          <marker id="arrow-end" markerWidth="12" markerHeight="12" refX="9" refY="5"
                  orient="auto-start-reverse" markerUnits="userSpaceOnUse">
            <path d="M0 0L10 5L0 10z" fill="context-stroke"/>
          </marker>
          <marker id="arrow-start" markerWidth="12" markerHeight="12" refX="9" refY="5"
                  orient="auto-start-reverse" markerUnits="userSpaceOnUse">
            <path d="M0 0L10 5L0 10z" fill="context-stroke"/>
          </marker>
        </defs>
        <g id="page-layer">
          <rect id="page" x="0" y="0" width="1000" height="700"/>
          <rect id="grid-rect" x="0" y="0" width="1000" height="700" fill="url(#grid-major)" pointer-events="none"/>
        </g>
        <g id="doc-layer"></g>
        <g id="chrome-layer"></g>
      </svg>
      <div id="zoom-controls" aria-label="Zoom">
        <button id="grid-toggle" type="button" class="toggle-btn" title="Show grid (Ctrl+&apos;)" aria-pressed="false">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M5.5 1v14M10.5 1v14M1 5.5h14M1 10.5h14" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <button id="snap-toggle" type="button" class="toggle-btn" title="Snap to grid (Ctrl+Shift+&apos;)" aria-pressed="false">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2 2h5v5H2zM9 9h5v5H9z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M7 4.5h4.5V9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="1.5 1.5"/></svg>
        </button>
        <span class="zoom-sep"></span>
        <button id="zoom-out" type="button" title="Zoom out (Ctrl -)">&minus;</button>
        <button id="zoom-readout" type="button" title="Reset to 100% (Ctrl+Shift+0)">100%</button>
        <button id="zoom-in" type="button" title="Zoom in (Ctrl +)">+</button>
        <button id="zoom-fit" type="button" title="Fit to view (Ctrl 0)">Fit</button>
      </div>
    </main>

    <aside id="side">
      <section id="props" aria-label="Properties">
        <h2>Properties</h2>
        <div id="props-empty" class="empty">No selection</div>
        <div id="props-form" hidden>
          <label>Fill <input type="color" id="p-fill"></label>
          <label class="chk"><input type="checkbox" id="p-fill-none"> None</label>
          <label>Stroke <input type="color" id="p-stroke"></label>
          <label class="chk"><input type="checkbox" id="p-stroke-none"> None</label>
          <label>Stroke width <input type="number" id="p-stroke-width" min="0" step="0.5"></label>
          <label>Opacity
            <span class="opacity-group">
              <input type="range" id="p-opacity" min="0" max="1" step="0.01">
              <input type="number" id="p-opacity-num" min="0" max="1" step="0.01">
            </span>
          </label>
          <label>Rotation <input type="number" id="p-rotation" step="1"></label>
          <div class="props-divider">Text</div>
          <label class="wide">Content <input type="text" id="p-text" placeholder="(shape label or text)"></label>
          <label>Font size <input type="number" id="p-font-size" min="1" step="1"></label>
          <label>Font family <select id="p-font-family">
            <option value="sans-serif">sans-serif</option>
            <option value="serif">serif</option>
            <option value="monospace">monospace</option>
            <option value="cursive">cursive</option>
            <option value="fantasy">fantasy</option>
          </select></label>
          <label>Text color <input type="color" id="p-text-color"></label>
          <div class="props-divider">Align</div>
          <div id="align-grid" class="align-grid" role="group" aria-label="Align">
            <button class="align-btn" type="button" data-align="left" title="Align left edges">
              <svg viewBox="0 0 24 24" width="16" height="16"><rect x="2" y="3" width="1.5" height="18" fill="currentColor"/><rect x="5" y="6" width="10" height="4" fill="currentColor"/><rect x="5" y="14" width="15" height="4" fill="currentColor"/></svg>
            </button>
            <button class="align-btn" type="button" data-align="center-h" title="Align horizontal centers">
              <svg viewBox="0 0 24 24" width="16" height="16"><rect x="11.25" y="2" width="1.5" height="20" fill="currentColor"/><rect x="7" y="6" width="10" height="4" fill="currentColor"/><rect x="4.5" y="14" width="15" height="4" fill="currentColor"/></svg>
            </button>
            <button class="align-btn" type="button" data-align="right" title="Align right edges">
              <svg viewBox="0 0 24 24" width="16" height="16"><rect x="20.5" y="3" width="1.5" height="18" fill="currentColor"/><rect x="9" y="6" width="10" height="4" fill="currentColor"/><rect x="4" y="14" width="15" height="4" fill="currentColor"/></svg>
            </button>
            <button class="align-btn" type="button" data-align="dist-h" title="Distribute horizontally">
              <svg viewBox="0 0 24 24" width="16" height="16"><rect x="2" y="6" width="4" height="12" fill="currentColor"/><rect x="10" y="6" width="4" height="12" fill="currentColor"/><rect x="18" y="6" width="4" height="12" fill="currentColor"/></svg>
            </button>
            <button class="align-btn" type="button" data-align="top" title="Align top edges">
              <svg viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="2" width="18" height="1.5" fill="currentColor"/><rect x="6" y="5" width="4" height="10" fill="currentColor"/><rect x="14" y="5" width="4" height="15" fill="currentColor"/></svg>
            </button>
            <button class="align-btn" type="button" data-align="middle-v" title="Align vertical centers">
              <svg viewBox="0 0 24 24" width="16" height="16"><rect x="2" y="11.25" width="20" height="1.5" fill="currentColor"/><rect x="6" y="7" width="4" height="10" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" fill="currentColor"/></svg>
            </button>
            <button class="align-btn" type="button" data-align="bottom" title="Align bottom edges">
              <svg viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="20.5" width="18" height="1.5" fill="currentColor"/><rect x="6" y="9" width="4" height="10" fill="currentColor"/><rect x="14" y="4" width="4" height="15" fill="currentColor"/></svg>
            </button>
            <button class="align-btn" type="button" data-align="dist-v" title="Distribute vertically">
              <svg viewBox="0 0 24 24" width="16" height="16"><rect x="6" y="2" width="12" height="4" fill="currentColor"/><rect x="6" y="10" width="12" height="4" fill="currentColor"/><rect x="6" y="18" width="12" height="4" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
      </section>

      <section id="layers-section" aria-label="Layers">
        <div class="layers-head">
          <button type="button" class="section-toggle" data-section="layers" aria-expanded="true">
            <svg class="section-caret" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="section-title">Layers</span>
          </button>
        </div>
        <div id="layers-list" role="tree" tabindex="0"></div>
      </section>

      <section id="source-section" class="collapsed" aria-label="SVG source">
        <div class="source-head">
          <button type="button" class="section-toggle" data-section="source" aria-expanded="false">
            <svg class="section-caret" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="section-title">SVG source</span>
          </button>
          <div class="source-btns">
            <label class="tight-toggle" title="Crop viewBox tight to content (8-unit padding)">
              <input type="checkbox" id="tight-mode"> Tight
            </label>
            <button id="open-btn" type="button" title="Open a .euclid.json document (Ctrl+O)">Open</button>
            <button id="save-btn" type="button" title="Save your document as .euclid.json — round-trips everything (Ctrl+S)">Save</button>
            <button id="import-btn" type="button" title="Import SVG markup">Import</button>
            <button id="copy-btn" type="button" title="Copy SVG source to clipboard">Copy</button>
            <button id="download-btn" type="button" title="Export a portable .svg file">Export SVG</button>
          </div>
        </div>
        <pre id="source" tabindex="0"></pre>
      </section>
    </aside>
  </div>

  <input type="file" id="open-file" accept=".json,application/json" hidden>

  <div id="import-modal" class="modal" hidden aria-modal="true" role="dialog" aria-labelledby="import-title">
    <div class="modal-card">
      <h3 id="import-title">Import SVG</h3>
      <p class="modal-hint">Paste SVG markup. Illustrator exports with class-based styles work. Gradients, patterns, filters, clip paths, masks, &lt;use&gt;, &lt;image&gt;, and non-rigid transforms (scale/skew) will cause the import to fail.</p>
      <textarea id="import-text" spellcheck="false" placeholder="<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 200 100&quot;>&#10;  <rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;80&quot; height=&quot;80&quot; fill=&quot;#88ccee&quot;/>&#10;</svg>"></textarea>
      <div class="modal-row">
        <label class="chk"><input type="radio" name="import-mode" value="append" checked> Append</label>
        <label class="chk"><input type="radio" name="import-mode" value="replace"> Replace</label>
      </div>
      <div id="import-error" class="modal-error" hidden></div>
      <div class="modal-btns">
        <button id="import-cancel" type="button">Cancel</button>
        <button id="import-confirm" type="button" class="primary">Import</button>
      </div>
    </div>
  </div>

  <script src="js/euclid.bundle.js"></script>
</body>
</html>
