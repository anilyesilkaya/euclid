name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy-pages action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No build step: js/euclid.bundle.js is committed to the repo, so the
      # site is deployed straight from the checked-in static files. (Rebuild
      # locally with `npm run build` after editing the js/ modules.)
      - name: Assemble site
        run: |
          mkdir -p _site/js
          cp index.html styles.css _site/
          cp js/euclid.bundle.js _site/js/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
